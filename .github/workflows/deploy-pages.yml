name: Deploy Cozy Country scene

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the complete scene bundle
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/shifatmasud/cozy-country-r3f-pages/releases/download/v1.0.0/cozy-country-r3f-scene.zip \
            --output cozy-country-r3f-scene.zip
          mkdir -p .work site
          unzip -q cozy-country-r3f-scene.zip -d .work
          test -f .work/cozy-country-r3f-scene/package.json
      - name: Build the scene
        run: |
          npm --prefix .work/cozy-country-r3f-scene install
          npm --prefix .work/cozy-country-r3f-scene run build
          cp -R .work/cozy-country-r3f-scene/dist/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
